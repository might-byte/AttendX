<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner safe area decoration -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Biometric Scanner Corners -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)">
    <!-- Top-Left -->
    <path d="M 140 180 L 140 140 L 180 140" />
    <!-- Top-Right -->
    <path d="M 332 140 L 372 140 L 372 180" />
    <!-- Bottom-Left -->
    <path d="M 140 332 L 140 372 L 180 372" />
    <!-- Bottom-Right -->
    <path d="M 332 372 L 372 372 L 372 332" />
  </g>

  <!-- Central Face Silhouette & Facial Mesh nodes -->
  <g fill="#ffffff">
    <!-- Face Head -->
    <ellipse cx="256" cy="225" rx="55" ry="65" />
    <!-- Face Shoulders -->
    <path d="M 190 345 C 190 295, 322 295, 322 345 C 322 355, 190 355, 190 345 Z" />
  </g>

  <!-- Geofence Location Pin Badge -->
  <g transform="translate(305, 290)" filter="url(#shadow)">
    <circle cx="45" cy="45" r="48" fill="#10b981" />
    <path d="M 45 22 C 34.5 22 26 30.5 26 41 C 26 55 45 74 45 74 C 45 74 64 55 64 41 C 64 30.5 55.5 22 45 22 Z M 45 47 C 41.7 47 39 44.3 39 41 C 39 37.7 41.7 35 45 35 C 48.3 35 51 37.7 51 41 C 51 44.3 48.3 47 45 47 Z" fill="#ffffff" />
  </g>

  <!-- Biometric Scan Ray -->
  <line x1="150" y1="230" x2="362" y2="230" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4" opacity="0.85" />
</svg>
